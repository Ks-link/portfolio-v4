<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library — Kaleb Link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Rammetto+One&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffff4;
        --text: #322f2f;
        --muted: color-mix(in srgb, var(--text) 62%, var(--bg));
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141211;
          --text: #fffff4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2.5rem 1.5rem 4rem;
        font-family: Outfit, sans-serif;
        font-weight: 300;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      a {
        color: inherit;
      }
      .back {
        display: inline-block;
        margin-bottom: 2rem;
        text-decoration: none;
        opacity: 0.7;
      }
      .back:hover {
        opacity: 1;
      }
      h1 {
        font-family: "Rammetto One", sans-serif;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 400;
        line-height: 1.1;
        margin: 0 0 0.6rem;
      }
      .lede {
        margin: 0 0 2.4rem;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li + li {
        margin-top: 1.4rem;
      }
      h2 {
        font-size: 1.35rem;
        font-weight: 500;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .note {
        margin-top: 2.8rem;
        padding-top: 1.2rem;
        border-top: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">← Back to portfolio</a>
      <h1>Library</h1>
      <p class="lede">Older web projects, served as static sites.</p>
      <ul>
        <li>
          <h2><a href="/library/tile-wars/">Tile Wars</a></h2>
          <p>Two-player browser game.</p>
        </li>
      </ul>
      <p class="note">
        WordPress and PHP sites (e.g. Snacklab) cannot run on this static host. They stay in
        the archive for reference and are not deployed here.
      </p>
    </main>
  </body>
</html>
