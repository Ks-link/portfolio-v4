<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/favicon-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fffff4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#141211"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms &amp; Conditions — Link Web Development</title>
    <meta
      name="description"
      content="Terms and conditions for Link Web Development. Placeholder page."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffff4;
        --text: #322f2f;
        --accent: #ee7330;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141211;
          --text: #fffff4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2.5rem 1.5rem 4rem;
        font-family: Outfit, sans-serif;
        font-weight: 300;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      a {
        color: inherit;
      }
      .back {
        display: inline-block;
        margin-bottom: 2rem;
        text-decoration: none;
        opacity: 0.7;
      }
      .back:hover {
        opacity: 1;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-weight: 500;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        letter-spacing: 0.02em;
      }
      .lede {
        margin: 0 0 1.75rem;
        opacity: 0.7;
        line-height: 1.55;
      }
      .placeholder {
        margin: 0;
        padding: 1.1rem 1.15rem;
        border: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
        border-radius: 0.55rem;
        line-height: 1.55;
        opacity: 0.85;
      }
      .meta {
        margin: 1.75rem 0 0;
        font-size: 0.85rem;
        opacity: 0.55;
      }
      .meta a {
        color: var(--accent);
        text-decoration: none;
      }
      .meta a:hover {
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">← Back</a>
      <h1>Terms &amp; Conditions</h1>
      <p class="lede">Link Web Development</p>
      <p class="placeholder">
        This is a placeholder for the Terms &amp; Conditions. Full terms will be
        published here soon.
      </p>
      <p class="meta">
        © 2026 Link Web Development ·
        <a href="/privacy.html">Privacy Policy</a>
      </p>
    </main>
  </body>
</html>
